<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != "Song list" %}{{ page.title }} &middot; {% endif %}{{ site.title }}</title>
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=6">
</head>
<body>
  <header class="site-header">
    <a href="{{ '/' | relative_url }}" class="site-brand">
      <span class="site-mark" aria-hidden="true">♪</span>
      <span class="site-title">{{ site.title }}</span>
    </a>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode">Dark mode</button>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    <a href="{{ '/builder/' | relative_url }}">Transcribe a song</a>
  </footer>
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
</body>
</html>
