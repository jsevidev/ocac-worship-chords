---
layout: default
---
<article class="song-page">
  <div class="song-controls">
    <button type="button" class="fit-toggle fit-toggle--active" id="fit-screen-toggle" aria-pressed="true">
      Scroll mode
    </button>
    <span class="fit-hint">Whole song on one screen — tap to scroll instead</span>
  </div>
  <div class="fit-stage">
    <div class="fit-scaler">
      <div class="fit-content">
        <header class="song-header">
          <a href="{{ '/' | relative_url }}" class="back-link">&larr; All songs</a>
          <h1 class="song-title">{{ page.title }}</h1>
          <div class="song-badges">
            <span class="badge">Notebook {{ page.notebook }}</span>
            <span class="badge badge-muted">Page {{ page.page }}</span>
          </div>
        </header>
        <div class="chord-block">
          {{ content }}
        </div>
      </div>
    </div>
  </div>
  <script src="{{ '/assets/js/chord-display.js' | relative_url }}?v=16"></script>
  <script src="{{ '/assets/js/fit-screen.js' | relative_url }}?v=2"></script>
</article>
