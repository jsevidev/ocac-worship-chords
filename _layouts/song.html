---
layout: default
---
<article class="song-page">
  <header class="song-header">
    <a href="{{ '/' | relative_url }}" class="back-link">&larr; All songs</a>
    <h1 class="song-title">{{ page.title }}</h1>
    <div class="song-badges">
      <span class="badge">Notebook {{ page.notebook }}</span>
      <span class="badge badge-muted">Page {{ page.page }}</span>
    </div>
  </header>
  <div class="chord-block">
    {{ content }}
  </div>
  <script src="{{ '/assets/js/chord-display.js' | relative_url }}?v=11"></script>
</article>
