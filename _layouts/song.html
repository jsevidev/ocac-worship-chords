---
layout: default
---
<article class="song-page">
  <header class="song-header">
    <a href="{{ '/' | relative_url }}" class="back-link">&larr; All songs</a>
    <h1 class="song-title">{{ page.title }}</h1>
    <div class="song-badges">
      <span class="badge">Notebook {{ page.notebook }}</span>
      <span class="badge badge-muted">Page {{ page.page }}</span>
    </div>
    <div class="legend-chips">
      {% for item in site.section_legend %}
      <span class="chip"><strong>{{ item.numeral }}</strong> {{ item.name }}</span>
      {% endfor %}
    </div>
  </header>
  <div class="chord-block" data-section-legend="{% for item in site.section_legend %}{{ item.numeral }}:{{ item.name }}{% unless forloop.last %}|{% endunless %}{% endfor %}">
    {{ content }}
  </div>
  <script src="{{ '/assets/js/chord-display.js' | relative_url }}?v=6"></script>
</article>
