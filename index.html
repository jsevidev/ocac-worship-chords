---
layout: default
title: Song list
---
<div class="page-hero">
  <h1 class="page-title">Song library</h1>
  <p class="page-subtitle">Browse chord sheets from the worship notebooks. Open any song — it fills your screen automatically so you can read it at a glance on stage or in rehearsal.</p>
</div>

<div class="list-controls card-panel">
  <div class="search-wrap">
    <label class="visually-hidden" for="search">Search songs</label>
    <input type="search" id="search" placeholder="Search by song title…" autocomplete="off">
  </div>
  <div class="filter-row">
    <div class="filter-field">
      <label for="sort-by">Sort</label>
      <select id="sort-by">
        <option value="alpha">A → Z</option>
        <option value="notebook">By notebook</option>
      </select>
    </div>
    <div class="filter-field">
      <label for="filter-notebook">Notebook</label>
      <select id="filter-notebook">
        <option value="all">All notebooks</option>
      </select>
    </div>
  </div>
</div>

<div id="song-list" class="song-list"></div>

<p id="list-meta" class="list-meta" hidden></p>
<nav id="pagination" class="pagination card-panel" aria-label="Song list pages" hidden>
  <button type="button" class="page-btn" id="page-prev" disabled>Previous</button>
  <span class="page-info" id="page-info">Page 1 of 1</span>
  <button type="button" class="page-btn" id="page-next" disabled>Next</button>
</nav>
<p id="no-results" class="empty-state" hidden>No songs match your search.</p>

<script id="song-data" type="application/json">
[
{% for song in site.songs %}
  {
    "title": {{ song.title | jsonify }},
    "url": {{ song.url | relative_url | jsonify }},
    "notebook": {{ song.notebook | jsonify }},
    "page": {{ song.page | jsonify }}
  }{% unless forloop.last %},{% endunless %}
{% endfor %}
]
</script>
<script src="{{ '/assets/js/song-list.js' | relative_url }}?v=2"></script>
