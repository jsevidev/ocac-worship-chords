title: OCAC Worship Chords
description: Chord sheets, digitized

collections:
  songs:
    output: true
    permalink: /songs/:slug/

markdown: kramdown

defaults:
  - scope:
      path: ""
      type: songs
    values:
      layout: song

# GitHub publish settings (used by the builder)
publish:
  owner: jsevidev
  repo: ocac-worship-chords
  branch: main
  songs_path: _songs

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - docs/
